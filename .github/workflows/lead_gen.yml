name: Daily Lead Generation (Naukri + Instahyre)

on:
  schedule:
    # 9:00 AM IST = 3:30 AM UTC
    - cron: '30 3 * * *'
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright pandas openpyxl
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper
        working-directory: lead_gen
        env:
          NAUKRI_STATE:        ${{ secrets.NAUKRI_STATE }}
          INSTAHYRE_STATE:     ${{ secrets.INSTAHYRE_STATE }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 main_gha.py

      - name: Upload Excel as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_id }}
          path: /tmp/lead_generation_runs/*.xlsx
          retention-days: 30
